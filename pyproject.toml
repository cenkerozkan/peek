[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Distribution name is `peek-db`: `peek` and `peek-mcp` are both taken on PyPI
# (the latter by an unrelated MCP server). Not `peek-sql` — NoSQL (MongoDB) is on
# the roadmap, and a PyPI name is permanent. The import package and the console
# command both remain `peek` — see decisions.md #19.
name = "peek-db"
version = "0.1.2"
description = "Safe, multi-database, read-only SQL and NoSQL MCP server"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Cenker Ozkan", email = "cenkerozkanse@gmail.com" }]
keywords = ["mcp", "sql", "sqlalchemy", "read-only", "database"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "click",
    "fastmcp",
    "sqlalchemy",
    "sqlglot",
    "platformdirs",
    "pydantic",
    "pydantic-settings",
    "tomlkit",
]

[project.optional-dependencies]
# Database drivers (DBAPIs). SQLAlchemy ships dialects, not drivers, so each
# non-SQLite backend needs its connector installed. SQLite works out of the box
# (stdlib sqlite3). Install only what you connect to, e.g. peek-db[postgres,mysql].
# A `mongo` extra (pymongo) arrives with the MongoDB backend — roadmap Phase 11.
postgres = ["psycopg[binary]"]
mysql = ["pymysql"]
mssql = ["pyodbc"]
oracle = ["oracledb"]
all-drivers = [
    "psycopg[binary]",
    "pymysql",
    "pyodbc",
    "oracledb",
]

[dependency-groups]
# A PEP 735 group, not an extra: uv installs it by default (`uv run`, `uv sync`),
# whereas an extra needs an explicit `--extra dev` and so is missing in CI. It is
# also not published, so `pip install peek-db[dev]` can't hand users our linters.
dev = [
    "ruff==0.15.20",
    "isort==8.0.1",
    "ty==0.0.56",
    "pre-commit==4.6.0",
    "pytest==9.1.1",
]

[project.urls]
Homepage = "https://github.com/cenkerozkan/peek"
Repository = "https://github.com/cenkerozkan/peek"

[project.scripts]
# Console entry point. Launch is `uvx --from peek-db peek` (the distribution and
# the command differ); `pipx install peek-db` and `python -m peek` also work.
peek = "peek.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/peek"]

[tool.ruff]
# Strict PEP8: 79-char lines. (Adjustable if the team finds it too tight.)
line-length = 79
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W = pycodestyle (PEP8), F = pyflakes, B = bugbear, D = pydocstyle,
# ERA = commented-out code (supports the "no comment lines" house rule).
# NOTE: pyupgrade (UP) is intentionally NOT enabled, so ruff never rewrites
# typing.Optional/Union into `X | Y` pipe syntax. House rule: use `typing`.
select = ["E", "W", "F", "B", "D", "ERA"]
# Docstrings are optional (allowed, not required) except MCP tools — so ignore
# the "missing docstring" rules. Google style is enforced when a docstring exists.
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.isort]
profile = "black"
line_length = 79
src_paths = ["src", "tests"]
known_first_party = ["peek"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src-layout: put the package root on the path so tests import `peek`
# (not `src.peek`) exactly as an installed wheel would.
pythonpath = ["src"]
